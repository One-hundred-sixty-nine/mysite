<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이지성의 자기소개</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div>
            <h1>이지성의 자기소개</h1>
            <nav>
                <ul>
                    <li><a href="index.html">처음</a></li>
                    <li><a href="about.html">자기소개</a></li>
                    <li><a href="couses.html">수강 과목</a></li>
                    <li><a href="about.html#call">연락하러 가기</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h2>L/H</h2>
            <ol>
                <li>L 
                    <ul>
                        <li>코딩</li>
                        <li>게임</li>
                    </ul>
                </li>
                <li>H 
                    <ul>
                        <li>토마토</li>
                        <li>예의 없음</li>
                    </ul>
                </li>
            </ol>
        </section>

        <aside id="call">
            <h3>연락 하기</h3>
            <form action="https://httpbin.org/post" method="post" target="_blank">
                <p>
                    <label for="name">이름</label><br>
                    <input type="text" id="name" name="name" placeholder="홍길동" required>
                </p>
                <p>
                    <label for="email">이메일</label><br>
                    <input type="email" id="email" name="email" placeholder="name@email.com" required>
                </p>
                <p>
                    <label for="tel">전화번호</label><br>
                    <input type="tel" id="tel" name="tel" placeholder="010-0000-0000">
                </p>
                <p>
                    <label for="me">문의 종류</label><br>
                    <select id="me" name="me">
                        <option value="project">프로젝트 문의</option>
                        <option value="DB">데이터 베이스 관련</option>
                        <option value="ps">개인 사무용 연락</option>
                    </select>
                </p>
                <p>
                    <label for="memo">내용</label><br>
                    <textarea id="memo" name="memo" rows="4"></textarea>
                </p>
                <p>
                    <button type="submit">보내기</button>
                </p>
            </form>
        </aside>
    </main>

    <footer>
        <p>&copy; 
            <a href="https://www.naver.com/" target="_blank">이지성</a>
        </p>
    </footer>
</body>
</html>
